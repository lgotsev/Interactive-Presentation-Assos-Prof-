 const frames={};
 const digits=['01','02','03','04'];
 let selected='01';
 const once={};
 function decode(doc){
  const bytes=Uint8Array.from(atob(doc),c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
 }
 function load(n){if(once[n])return;const frame=document.getElementById('analysis-'+n);frame.srcdoc=decode(docs[n]);once[n]=true;}
 function activate(n){
  if(!digits.includes(n))return;
  selected=n;
  load(n);
  for(const id of digits){document.getElementById('analysis-'+id).classList.toggle('hide',id!==n);}
 }
 for(const n of digits)frames[n]=document.getElementById('analysis-'+n);
 window.addEventListener('message',function(ev){
  if(!ev.data||ev.data.qmlApp!=='section'||!digits.includes(ev.data.section))return;
  if(!Object.values(frames).some(fr=>fr.contentWindow===ev.source))return;
  activate(ev.data.section);
 });
 /* Initialise one module on entering research, retaining the state of loaded modules. */
 document.querySelector('[data-page="analysis"]').addEventListener('click',()=>activate(selected));
 /* Keyboard shortcuts for primary application navigation, outside editable controls. */
 document.addEventListener('keydown',e=>{
  if(e.altKey&&['1','2','3','4'].includes(e.key)&&!e.ctrlKey&&!e.metaKey){
   e.preventDefault();const pages=['home','presentation','analysis','discussion'];
   document.querySelector('[data-page="'+pages[Number(e.key)-1]+'"]').click();
  }
 });
 window.qmlIntegrationTest={activate,getSection:()=>selected,getSlide:()=>document.getElementById('slide-count').textContent};
})();
</script></body></html>
